# Información del proyecto
sonar.projectKey=TowerDefense_Project
sonar.projectName=TowerDefense_Project
sonar.projectVersion=1.0

# Ruta al código fuente (. = directorio actual)
sonar.sources=.

# Exclusiones - esto excluirá node_modules del análisis
sonar.exclusions=**/node_modules/**/*

# Específicamente excluir los archivos problemáticos de pngjs
sonar.exclusions=**/node_modules/pngjs/coverage/**/*

# Codificación del código fuente
sonar.sourceEncoding=UTF-8

# Lenguajes a analizar (opcional, lo detecta automáticamente)
sonar.language=js

# Rutas a excluir de la cobertura de código (opcional)
# sonar.coverage.exclusions=**/*.test.js,**/*.spec.js,**/tests/**/*

# Ruta a los informes de pruebas unitarias (opcional)
# sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Ignora problemas específicos (opcional)
# sonar.issue.ignore.multicriteria=e1
# sonar.issue.ignore.multicriteria.e1.ruleKey=javascript:S1234
# sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.js